{% set name = "smoothify" %}
{% set version = "0.3.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/smoothify-{{ version }}.tar.gz
  sha256: b2c358d9c75146c896457d8792c7a7de08bb2e603bd86d6afc46a56498d14ada

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - geopandas >=1.0.0
    - joblib >=1.4.0
    - numpy >=1.27.0
    - scipy >=1.11.0
    - shapely >=2.0.2

test:
  imports:
    - smoothify
  commands:
    - pip check
    # Guards against setuptools-scm being absent from `host:`, which makes the
    # build silently record version 0.0.0 in the installed dist-info. This must
    # check importlib.metadata rather than smoothify.__version__: the latter
    # reads _version.py, which ships pre-generated in the sdist and so stays
    # correct even when the build is broken.
    - python -c "from importlib.metadata import version; assert version('smoothify') == '{{ version }}', version('smoothify')"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/DPIRD-DMA/Smoothify
  summary: Transform pixelated geometries from raster data into smooth natural looking features
  description: A Python package for smoothing and refining geometries derived from raster data classifications. Smoothify transforms jagged polygons and lines resulting from raster-to-vector conversion into smooth, visually appealing features using an optimized implementation of Chaikin's corner-cutting algorithm.
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/DPIRD-DMA/Smoothify

extra:
  recipe-maintainers:
    - wrignj08
    - giswqs
